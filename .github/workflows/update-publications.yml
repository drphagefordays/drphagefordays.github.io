name: Update publications

# Runs on the 1st of every month, and can be started by hand from the Actions tab.
on:
  schedule:
    - cron: "17 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write   # commit the updated list
  actions: write    # re-enable this schedule (GitHub pauses idle schedules after 60 days)

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the publications list from ORCID and Crossref
        run: python scripts/update_publications.py

      - name: Commit if the list changed
        run: |
          if [ -n "$(git status --porcelain index.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Update publications from ORCID"
            git push
          else
            echo "No new publications."
          fi

      - name: Keep the monthly schedule active
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable update-publications.yml
